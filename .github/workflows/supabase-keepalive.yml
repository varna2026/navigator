name: Supabase Keep Alive - Navigator Varna

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase configuration"
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          HTTP_CODE=$(curl -sS -o /tmp/supabase-response.txt \
            -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
           "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1"

          echo "Supabase HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Supabase check failed"
            cat /tmp/supabase-response.txt
            exit 1
          fi

          echo "Supabase is responding successfully"
